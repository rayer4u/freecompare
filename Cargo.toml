[workspace]
resolver = "2"
members = [
    "crates/core",
    "crates/cli",
    "src-tauri",
]

[workspace.package]
version = "0.6.0"
edition = "2024"
license = "MIT"
authors = ["rayer4u"]
repository = "https://github.com/rayer4u/freecompare"

[workspace.dependencies]
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
thiserror = "2.0"
anyhow = "1.0"
ropey = "1.6"
imara-diff = "0.1"
similar = { version = "2.6", features = ["inline", "unicode"] }
encoding_rs = "0.8"
blake3 = "1.5"
jwalk = "0.8"
globset = "0.4"
rayon = "1.10"
parking_lot = "0.12"
